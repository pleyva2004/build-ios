name: __APP_NAME__
options:
  bundleIdPrefix: __BUNDLE_PREFIX__
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"              # the live runtime (Sources/Runtime) is written for Swift 5 mode; keep it
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  __APP_NAME__:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: design                  # bundled copy of the UI (used when not hot-reloading, e.g. on a device)
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: __BUNDLE_ID__
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"   # iPhone + iPad
      configs:
        Debug:
          COMPILER_INDEX_STORE_ENABLE: NO   # skip index-while-building: faster CLI builds
